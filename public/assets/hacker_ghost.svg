<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' width='256' height='256'>
  <defs>
    <radialGradient id='photoBg' cx='60%' cy='40%' r='70%'>
      <stop offset='0%' stop-color='#334155'/>
      <stop offset='60%' stop-color='#1e293b'/>
      <stop offset='100%' stop-color='#0f172a'/>
    </radialGradient>
    <linearGradient id='hoodieLight' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#27272a'/>
      <stop offset='100%' stop-color='#09090b'/>
    </linearGradient>
    <linearGradient id='skinTone' x1='30%' y1='0%' x2='70%' y2='100%'>
      <stop offset='0%' stop-color='#fed7aa'/>
      <stop offset='50%' stop-color='#fdba74'/>
      <stop offset='100%' stop-color='#ea580c'/>
    </linearGradient>
  </defs>
  <!-- Realistic Muted Studio / Room Ambient Backdrop -->
  <rect width='256' height='256' fill='url(#photoBg)'/>
  <!-- Soft bokeh blur in background -->
  <circle cx='200' cy='60' r='35' fill='#475569' opacity='0.25'/>
  <circle cx='50' cy='200' r='45' fill='#334155' opacity='0.3'/>
  
  <!-- Realistic Candid Figure in Dark Hoodie -->
  <!-- Shoulders & Torso -->
  <path d='M30,256 C40,195 80,165 128,165 C176,165 216,195 226,256 Z' fill='url(#hoodieLight)' stroke='#18181b' stroke-width='2'/>
  <!-- Hoodie neckline & zipper -->
  <path d='M100,180 Q128,210 156,180 L160,256 L96,256 Z' fill='#18181b'/>
  <line x1='128' y1='195' x2='128' y2='256' stroke='#52525b' stroke-width='2'/>
  
  <!-- Head & Neck with realistic light falloff -->
  <path d='M114,150 L114,185 Q128,195 142,185 L142,150 Z' fill='#fb923c' opacity='0.8'/>
  <!-- Chin & Jawline -->
  <path d='M88,110 C88,155 105,178 128,178 C151,178 168,155 168,110 C168,75 151,65 128,65 C105,65 88,75 88,110 Z' fill='url(#skinTone)'/>
  
  <!-- Realistic Messy Dark Hair with Highlights -->
  <path d='M80,95 C75,60 100,40 128,40 C160,40 180,60 176,95 C170,80 155,55 128,55 C100,55 85,80 80,95 Z' fill='#18181b'/>
  <path d='M85,85 Q105,115 110,125 Q120,95 135,80 Q155,75 170,95 Q165,65 130,52 Q95,60 85,85 Z' fill='#27272a'/>
  <!-- Hair sideburns -->
  <path d='M86,95 L84,125 L92,110 Z' fill='#18181b'/>
  <path d='M170,95 L172,125 L164,110 Z' fill='#18181b'/>

  <!-- Realistic Modern Minimalist Wire Glasses -->
  <rect x='96' y='102' width='26' height='18' rx='4' fill='none' stroke='#cbd5e1' stroke-width='2'/>
  <rect x='134' y='102' width='26' height='18' rx='4' fill='none' stroke='#cbd5e1' stroke-width='2'/>
  <line x1='122' y1='110' x2='134' y2='110' stroke='#cbd5e1' stroke-width='2'/>
  <line x1='86' y1='106' x2='96' y2='106' stroke='#cbd5e1' stroke-width='1.5'/>
  <line x1='160' y1='106' x2='170' y2='106' stroke='#cbd5e1' stroke-width='1.5'/>

  <!-- Natural Eyes with realistic glint -->
  <ellipse cx='109' cy='111' rx='4.5' ry='3' fill='#0f172a'/>
  <ellipse cx='147' cy='111' rx='4.5' ry='3' fill='#0f172a'/>
  <circle cx='110.5' cy='110' r='1.2' fill='#ffffff'/>
  <circle cx='148.5' cy='110' r='1.2' fill='#ffffff'/>

  <!-- Eyebrows -->
  <path d='M96,98 Q109,94 122,98' stroke='#18181b' stroke-width='2' fill='none' stroke-linecap='round'/>
  <path d='M134,98 Q147,94 160,98' stroke='#18181b' stroke-width='2' fill='none' stroke-linecap='round'/>

  <!-- Subtle Nose Shadow & Lips -->
  <path d='M126,112 L124,134 L132,134' stroke='#c2410c' stroke-width='1.5' fill='none' stroke-linecap='round'/>
  <path d='M118,152 Q128,156 138,152' stroke='#9a3412' stroke-width='2' fill='none' stroke-linecap='round'/>
</svg>